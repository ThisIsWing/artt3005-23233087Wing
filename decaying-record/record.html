<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pale: '#F4F5F7',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom subtle animation for feedback when clicking archive */
    .btn-active:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="bg-pale min-h-screen flex items-center justify-center p-4 font-sans antialiased text-slate-800">

  <!-- Main Card Container: Approx 460px x 520px on desktop/standard views -->
  <main class="w-full max-w-[460px] min-h-[520px] bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-6 flex flex-col justify-between transition-all duration-300 hover:shadow-2xl hover:shadow-slate-200/80">
    
    <!-- Top Content Group -->
    <div class="flex flex-col gap-5">
      <!-- Large Image Placeholder -->
      <div class="w-full h-64 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 group cursor-pointer hover:border-indigo-400 hover:bg-slate-50 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 stroke-current transition-transform duration-300 group-hover:scale-110 group-hover:text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
        </svg>
        <span class="mt-2 text-xs font-medium uppercase tracking-wider text-slate-400 group-hover:text-indigo-500">Image Placeholder</span>
      </div>

      <!-- Text Section -->
      <div class="space-y-1.5 text-center sm:text-left">
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">
          Project Record #8402
        </h1>
        <p class="text-sm font-normal text-slate-500 tracking-normal">
          Last updated 2 hours ago by System Admin
        </p>
      </div>
    </div>

    <!-- Bottom Button -->
    <div class="mt-6">
      <button 
        id="archiveBtn" 
        onclick="handleArchive()"
        class="btn-active w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-xl transition-all duration-200 shadow-md shadow-slate-900/10 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2 flex items-center justify-center gap-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
        </svg>
        <span id="btnText">Archive this</span>
      </button>

      <!-- Custom Toast Message Notification -->
      <div id="toast" class="hidden mt-3 text-center text-xs font-semibold text-emerald-600 bg-emerald-50 py-2 rounded-lg border border-emerald-100 transition-all">
        Record successfully archived!
      </div>
    </div>

  </main>

  <script>
    function handleArchive() {
      const btn = document.getElementById('archiveBtn');
      const btnText = document.getElementById('btnText');
      const toast = document.getElementById('toast');

      // Update button state visually
      btnText.textContent = 'Archived';
      btn.classList.remove('bg-slate-900', 'hover:bg-slate-800');
      btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
      
      // Display visual toast message without alerts
      toast.classList.remove('hidden');

      // Revert back after 3 seconds for demo purposes
      setTimeout(() => {
        btnText.textContent = 'Archive this';
        btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
        btn.classList.add('bg-slate-900', 'hover:bg-slate-800');
        toast.classList.add('hidden');
      }, 3000);
    }
  </script>
</body>
</html>
